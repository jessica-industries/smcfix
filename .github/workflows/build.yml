name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows AMD64
            os: windows-latest
            arch: amd64
            goos: windows
            goarch: amd64
            binary: smcfix.exe
          - name: Windows ARM64
            os: windows-latest
            arch: arm64
            goos: windows
            goarch: arm64
            binary: smcfix-arm64.exe
          - name: Linux AMD64
            os: ubuntu-latest
            arch: amd64
            goos: linux
            goarch: amd64
            binary: smcfix
          - name: Linux ARM64
            os: ubuntu-latest
            arch: arm64
            goos: linux
            goarch: arm64
            binary: smcfix-arm64
          - name: macOS AMD64
            os: macos-latest
            arch: amd64
            goos: darwin
            goarch: amd64
            binary: smcfix-amd64
          - name: macOS ARM64
            os: macos-latest
            arch: arm64
            goos: darwin
            goarch: arm64
            binary: smcfix-arm64

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy
        go install fyne.io/tools/cmd/fyne@latest
        # Install X11 dependencies for Linux GUI builds
        if [ "${{ matrix.goos }}" = "linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxrender-dev libxss-dev libxtst-dev libx11-dev pkg-config
        fi

    - name: Build binary
      run: |
        # Build full version with GUI support using Fyne
        fyne package -os ${{ matrix.goos }} -icon assets/icon.png -name "SMCFix" -release
        echo "GUI app built for ${{ matrix.goos }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: smcfix-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          SMCFix.app
          SMCFix.exe
          SMCFix
        if-no-files-found: ignore

  package-macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy
        go install fyne.io/tools/cmd/fyne@latest

    - name: Install create-dmg
      run: |
        brew install create-dmg

    - name: Download macOS binaries
      uses: actions/download-artifact@v4
      with:
        pattern: smcfix-darwin-*

    - name: Create universal binary
      run: |
        mkdir -p bin/darwin
        mv smcfix-darwin-amd64/smcfix-amd64 bin/darwin/
        mv smcfix-darwin-arm64/smcfix-arm64 bin/darwin/
        lipo -create bin/darwin/smcfix-amd64 bin/darwin/smcfix-arm64 -output bin/darwin/smcfix

    - name: Package macOS app
      run: |
        # Build the full GUI version for macOS
        go build -o bin/darwin/smcfix .
        fyne package -os darwin -icon assets/icon.png -name "SMCFix" -release
        echo "macOS app packaged: SMCFix.app"

    - name: Create DMG
      run: |
        create-dmg \
          --app-drop-link 196 48 \
          --window-size 396 196 \
          --icon-size 100 \
          --icon "SMCFix.app" 48 48 \
          "SMCFix.dmg" \
          "SMCFix.app"
        echo "DMG created: SMCFix.dmg"

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SMCFix-macOS
        path: SMCFix.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, package-macos]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          smcfix-windows-amd64/smcfix.exe
          smcfix-windows-arm64/smcfix-arm64.exe
          smcfix-linux-amd64/smcfix
          smcfix-linux-arm64/smcfix-arm64
          SMCFix-macOS/SMCFix.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 